---
name: release

# `main` is production. The marketplace sources this plugin at `./` and no
# install or update command takes a ref, so `/plugin update` compares the
# `version` string on this branch and nowhere else. Landing here *is* shipping;
# this is the job that makes that true rather than aspirational.
on:
  push:
    branches: [main]

permissions:
  contents: write        # push the release commit's tag, open the Release
  pull-requests: read    # read the label and the body the release comes from

# One release at a time. Two jobs computing "the next version" from the same
# base is how two versions claim the same number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    # This job's own push lands back here, because a deploy-key push is a real
    # push unlike a GITHUB_TOKEN one. Guard on the identity it commits under
    # rather than `[skip ci]`, which would also skip `checks` and leave the one
    # commit nobody reviewed as the one commit nothing verified.
    if: github.event.head_commit.author.email != 'release@livespec.noreply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release.py diffs the merge against its first parent.
          fetch-depth: 0
          # The one credential that may write to `main`. A deploy key is scoped
          # to this repository alone and is the single bypass actor on the
          # ruleset — see specs/setup/README.md.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find the pull request this merge came from
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq 'map(select(.merged_at != null)) | first // empty' \
            > "$RUNNER_TEMP/pr.json"
          if [ -s "$RUNNER_TEMP/pr.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "no merged pull request for ${{ github.sha }} — nothing to release"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the version and the entry
        id: release
        if: steps.pr.outputs.found == 'true'
        run: |
          python3 .github/scripts/release.py \
            --pull-request "$RUNNER_TEMP/pr.json" --sha "${{ github.sha }}"

      # Before the push, not after. `main` is production: a tree that fails here
      # is a tree every install would pull.
      #
      # `--local` for the same reason `checks.yml` uses it: the one gate it
      # leaves out can only be cleared by a purchase, and this job cannot make
      # one either. Requiring it here would put the block 0033 removed from the
      # merge one step later, where it is worse — the change is already on
      # `main`, so a refusal leaves production carrying work that never got a
      # version. Every gate a failure here could actually mean still runs.
      # See specs/changes/0033-a-bill-nobody-approved-does-not-block.md.
      - name: Verify
        if: steps.release.outputs.released == 'true'
        run: python3 .github/scripts/verify.py --local

      - name: Commit and push
        if: steps.release.outputs.released == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NUMBER: ${{ steps.release.outputs.number }}
        run: |
          git config user.name  "livespec release"
          git config user.email "release@livespec.noreply"
          git add .claude-plugin/plugin.json CHANGELOG.md
          git commit -m "livespec ${VERSION}" -m "Released from #${NUMBER}. The version and the entry are that pull request's label and body; see .github/scripts/release.py."
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        if: steps.release.outputs.released == 'true'
        with:
          node-version: "22"

      # Closes the step CONTRIBUTING.md has always named and nothing ever ran:
      # 0.1.0 through 0.8.0 shipped untagged. `claude plugin tag` owns the
      # {name}--v{version} convention, so it is not restated here.
      - name: Tag
        if: steps.release.outputs.released == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin tag --push

      - name: Announce
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          # Through the environment rather than into the script: the entry is a
          # pull request body, and a body is text somebody else wrote.
          ENTRY: ${{ steps.release.outputs.entry }}
        run: |
          printf '%s\n' "$ENTRY" > "$RUNNER_TEMP/entry.md"
          gh release create "$TAG" \
            --title "livespec $VERSION" \
            --notes-file "$RUNNER_TEMP/entry.md"
