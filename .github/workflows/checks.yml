name: checks

on:
  push:
    branches: [main]
  pull_request:
    # The release-input gate reads this pull request's labels and body out of the
    # event payload, which is a snapshot of the moment the event fired. On the
    # default types — opened, synchronize, reopened — a label added at creation
    # or after it is not in that snapshot, so the check demanding a label fails
    # and adding one re-runs nothing. Re-running the job replays the same
    # payload and fails again; the only way to green was an unrelated commit.
    # Labels and the body are inputs to a gate here, so changing them is a
    # trigger for it.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  repository:
    name: repository checks
    runs-on: ubuntu-latest
    # The default token is read-only once any permission is named. The report
    # needs to write a comment; nothing else in this workflow writes anything.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The version gate diffs against the base branch.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # One command, the same one a person runs locally. A longer list in CI
      # than anybody can reproduce is how a required check stops being trusted.
      - name: Verify
        run: python3 .github/scripts/verify.py
      # A property of a pull request, not of a tree — which is why it is not part
      # of verify.py, and why it only runs here. It checks the two things the
      # release job cannot work out for itself: how big the change is, and what
      # to say about it. See .github/workflows/release.yml.
      - name: Release inputs
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/version_gate.py origin/${{ github.base_ref }}

      # Everything below is reporting, and it runs whether or not Verify passed.
      # A job stops at its first failing step unless a step says otherwise, and
      # that default made the report unreachable on the one run it exists for:
      # a red board is a failure the method sanctions committing and pushing, so
      # it is exactly when somebody needs to be told *which* red this is — and
      # the Stale row could only ever read zero. See method/gates.md, "The report
      # is not a gate", and specs/changes/0025-which-red-it-is.md.
      #
      # `!cancelled()` rather than `always()`: a cancelled run has nothing to
      # report and nobody waiting to read it.
      #
      # `continue-on-error` on every step is not laziness: `gates.md` declares
      # the report **not a gate**, and `always-green` in specs/spec.md is the
      # promise it would break. A missing token, a rate limit or a base ref that
      # will not check out must leave the build exactly as it was — which now
      # includes leaving a red build red. The report cannot turn one green: it
      # runs after the gating step and changes no step's outcome.
      # The cost is that the report going missing is itself silent.
      - name: The spec layer, here and on the base
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          python3 .github/scripts/trace.py --json > "$RUNNER_TEMP/head.json"
          # The *current* gate, run against the base tree — so the delta reports
          # what the spec layer did, not what a change to the gate did.
          git worktree add --detach "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
          python3 .github/scripts/trace.py "$RUNNER_TEMP/base" --json > "$RUNNER_TEMP/base.json"
          # Same shape for the eval board: `--json` is a hand-over that always
          # exits 0 — a stale board still gets *reported*, which is when the
          # row matters most. The gating already happened in verify.py above.
          python3 .github/scripts/board.py --json > "$RUNNER_TEMP/head-board.json"
          python3 .github/scripts/board.py "$RUNNER_TEMP/base" --json > "$RUNNER_TEMP/base-board.json"

      - name: Build the report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          python3 .github/scripts/report.py "$RUNNER_TEMP/head.json" "$RUNNER_TEMP/base.json" \
              "$RUNNER_TEMP/head-board.json" "$RUNNER_TEMP/base-board.json" \
            | tee "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment it on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        # One comment per pull request, rewritten in place, so pushing does not
        # bury the thread in near-identical reports.
        run: |
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/report.md" --edit-last --create-if-none \
            || gh pr comment "$PR" --body-file "$RUNNER_TEMP/report.md"

  manifests:
    name: plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `plugin validate` is an offline schema check — it needs no credentials.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace manifest
        run: claude plugin validate . --strict
      # --strict is dropped here alone. It treats warnings as errors, and this
      # repository is a plugin root that deliberately keeps its project CLAUDE.md
      # at the root — where `plugin validate` warns, correctly for a consumer and
      # wrongly for us. Any *other* warning still fails the job.
      - name: Validate the plugin manifest
        run: |
          out=$(claude plugin validate ./.claude-plugin/plugin.json 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if echo "$out" | grep -F '❯' | grep -vq 'CLAUDE.md at the plugin root'; then
            echo "::error::unexpected warning from plugin validate"
            exit 1
          fi
      - name: Validate the skills
        run: claude plugin validate ./skills --strict
