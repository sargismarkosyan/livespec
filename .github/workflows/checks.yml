name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # One command, the same one a person runs locally. A longer list in CI
      # than anybody can reproduce is how a required check stops being trusted.
      - name: Verify
        run: python3 .github/scripts/verify.py

  manifests:
    name: plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `plugin validate` is an offline schema check — it needs no credentials.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace manifest
        run: claude plugin validate . --strict
      # --strict is dropped here alone. It treats warnings as errors, and this
      # repository is a plugin root that deliberately keeps its project CLAUDE.md
      # at the root — where `plugin validate` warns, correctly for a consumer and
      # wrongly for us. Any *other* warning still fails the job.
      - name: Validate the plugin manifest
        run: |
          out=$(claude plugin validate ./.claude-plugin/plugin.json 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if echo "$out" | grep -F '❯' | grep -vq 'CLAUDE.md at the plugin root'; then
            echo "::error::unexpected warning from plugin validate"
            exit 1
          fi
      - name: Validate the skills
        run: claude plugin validate ./skills --strict
