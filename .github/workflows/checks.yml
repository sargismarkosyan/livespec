name: checks

on:
  push:
    branches: [main]
  pull_request:
    # The release-input gate reads this pull request's labels and body out of the
    # event payload, which is a snapshot of the moment the event fired. On the
    # default types — opened, synchronize, reopened — a label added at creation
    # or after it is not in that snapshot, so the check demanding a label fails
    # and adding one re-runs nothing. Re-running the job replays the same
    # payload and fails again; the only way to green was an unrelated commit.
    # Labels and the body are inputs to a gate here, so changing them is a
    # trigger for it.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  repository:
    name: repository checks
    runs-on: ubuntu-latest
    # The default token is read-only once any permission is named. The report
    # needs to write a comment; nothing else in this workflow writes anything.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The version gate diffs against the base branch.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The same command a person runs locally. The output is kept: the report
      # prints its last lines beside the run block the pull request's body
      # carries. `shell: bash` runs with pipefail, so the tee does not hide
      # verify.py's exit. See specs/changes/0052.
      - name: Verify
        shell: bash
        run: python3 .github/scripts/verify.py 2>&1 | tee "$RUNNER_TEMP/run.txt"
      # A property of a pull request, not of a tree — which is why it is not part
      # of verify.py, and why it only runs here. It checks the two things the
      # release job cannot work out for itself: how big the change is, and what
      # to say about it. See .github/workflows/release.yml.
      #
      # `!cancelled()` because it does not depend on Verify: this reads the pull
      # request, Verify reads the tree, and one failing says nothing about the
      # other. It is still a gate — no `continue-on-error` here.
      - name: Release inputs
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python3 .github/scripts/version_gate.py origin/${{ github.base_ref }}

      # Everything below is reporting, and runs on a red build too: what explains
      # a failure is worth having when there is one. `continue-on-error` on every
      # step because `gates.md` declares the report **not a gate**, and
      # `always-green` in specs/spec.md is the promise it would break. The report
      # cannot turn a red build green: it changes no step's outcome. The cost is
      # that the report going missing is itself silent.
      - name: The spec layer, here and on the base
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          python3 .github/scripts/trace.py --json > "$RUNNER_TEMP/head.json"
          # The *current* gate, run against the base tree — so the delta reports
          # what the spec layer did, not what a change to the gate did.
          git worktree add --detach "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
          python3 .github/scripts/trace.py "$RUNNER_TEMP/base" --json > "$RUNNER_TEMP/base.json"
          # Same shape for the eval board, which reports and never gates.
          python3 .github/scripts/board.py --json > "$RUNNER_TEMP/head-board.json"
          python3 .github/scripts/board.py "$RUNNER_TEMP/base" --json > "$RUNNER_TEMP/base-board.json"
          # The body as the event carries it, so the report can print the run
          # block it holds beside the Verify step's own output. See 0052.
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/body.md"

      - name: Build the report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          python3 .github/scripts/report.py "$RUNNER_TEMP/head.json" "$RUNNER_TEMP/base.json" \
              "$RUNNER_TEMP/head-board.json" "$RUNNER_TEMP/base-board.json" \
              "$RUNNER_TEMP/run.txt" "$RUNNER_TEMP/body.md" \
            | tee "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment it on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        # One comment per pull request, rewritten in place, so pushing does not
        # bury the thread in near-identical reports.
        run: |
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/report.md" --edit-last --create-if-none \
            || gh pr comment "$PR" --body-file "$RUNNER_TEMP/report.md"

  manifests:
    name: plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `plugin validate` is an offline schema check — it needs no credentials.
      - name: Install the Claude Code CLI
        id: install
        run: npm install -g @anthropic-ai/claude-code
      # The same argument as Release inputs above, three times: these read three
      # different files and none of them can fail because another did, so one
      # failure hiding the other two costs a round trip and buys nothing.
      #
      # Conditioned on the install rather than on `!cancelled()` alone, because
      # these *do* depend on something: with the CLI missing all three fail
      # saying so, which is one finding reported three times.
      # The two manifests run without --strict, and the step does what --strict
      # would, minus exactly two warnings it names. --strict treats every warning
      # as an error, and this repository is a plugin root that deliberately keeps
      # its project CLAUDE.md at the root, where `plugin validate` warns, correctly
      # for a consumer and wrongly for us. Since CLI 2.1.30x the warning comes from
      # the marketplace call too, and both calls append a *plugin directory*
      # section (icon, catalog notes) that the CLI says does not change the result:
      # it grades a submission to Anthropic's catalog, which this plugin is not.
      # Any *other* warning still fails the job. See specs/setup/README.md,
      # "Why the manifests are not --strict".
      - name: Validate the marketplace manifest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .github/scripts/validate-manifest.sh .
      - name: Validate the plugin manifest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .github/scripts/validate-manifest.sh ./.claude-plugin/plugin.json
      - name: Validate the skills
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: claude plugin validate ./skills --strict
