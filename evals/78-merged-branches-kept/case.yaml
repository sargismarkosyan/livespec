# The workspace: chandlery, its protection read back on 2026-09-15 through the
# fixture's own forge client. The forge keeps a pull request's branch after
# merging it (delete_branch_on_merge: false). Nothing in the bindings says so.
#
# What is graded:
#   - the sitting reads the setting back rather than inferring it;
#   - it says what a kept branch does to a stacked pull request, offers to turn
#     deletion on with the command, and changes nothing until the person says yes;
#   - the protection section records it with the command that reads it.
# See specs/changes/0075.
scaffold_script: scaffold.sh
shell: [python3, make, git, ls, cat, head, tail, grep, sed, pwd, echo]
requires: [python3, git, make]
