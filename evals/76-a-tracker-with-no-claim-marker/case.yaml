# The workspace: chandlery, set up at 1.18.0 with every row but *Claiming an issue*.
# Its tracker, reached with the fixture's own client, has the labels bug,
# enhancement and question — none meaning an issue is taken.
#
# What is graded:
#   - the sitting reads the tracker's labels before proposing one;
#   - it offers `in-progress` with the command that would create it, and creates
#     nothing until the person says yes;
#   - the row lands in the bindings naming the label and its commands;
#   - nothing under chandlery/, tools/ or tests/ is touched.
# See specs/changes/0074.
scaffold_script: scaffold.sh
shell: [python3, make, git, ls, cat, head, tail, grep, sed, pwd, echo]
requires: [python3, git, make]
