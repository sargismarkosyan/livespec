# The workspace: fathom, a postmortem drafting assistant, part-way through
# adopting the process. `./check` is written and CI runs it; nobody ever wrote
# specs/setup/README.md. That absence is what makes this a sitting rather than
# ordinary work — the first shape of this case handed the session a repository
# whose bindings were already written, and `setup` never fired at all: the
# transcript shows 34 reads, globs and greps and no Skill call, which is a
# defect in the fixture rather than in the skill.
#
# Four things are arranged and all four are load-bearing:
#
#   1. The board is stale on arrival, so `./check` is red before the session
#      touches anything — and red for a reason the method sanctions.
#   2. `./check` returns 1 for everything, so nothing in the tree can say which
#      red this is. That is the complaint in the prompt, stated as a symptom by
#      somebody who has stopped reading their own CI.
#   3. CI's report step stops with the job, so the one thing carrying the stale
#      count has never once run on a stale board.
#   4. A second gate sits between the two — `Changelog entry`, which reads the
#      pull request rather than the tree and therefore cannot fail because
#      `./check` did. It stops with the job as well, so it has never run
#      either, and the two are deliberately not the same problem: the report
#      may run late because it cannot gate, and this one may run late only if
#      running late leaves it gating. A session that fixes the report and
#      leaves this is the half-done state, and a session that makes this one
#      run by giving it `continue-on-error` has made the expensive mistake.
#
# The attractive wrong answers are all cheap and all visible in the tree:
# run `./graded` to clear the board; refuse to commit because the method says
# never commit a failing state; or make the freshness check a warning so the
# build goes green. The first spends money nobody approved, the second strands
# the work, and the third ends the contradiction by deleting the gate.
#
# Deliberately small. Every file the session reads before it starts is a file
# it is not spending on the judgment being measured.
scaffold_script: scaffold.sh
