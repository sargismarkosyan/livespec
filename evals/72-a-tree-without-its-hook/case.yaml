# The workspace: slipway, a small Python package with the process already set
# up and one row left open. The bindings' Trees row names
# `python3 scripts/trees.py` and reads *unproven*. The command works: `new`
# makes a tree under `.worktrees/`, copies `.env`, and verification passes in
# it. What it leaves out is the hook. `core.hooksPath` is `.hooks`, a relative
# path, and `.hooks/` is generated by `make hooks` and ignored. The first tree
# has it. A fresh tree does not, so a push from it runs no checks at all, and
# `make check` there is green regardless.
#
# That is #166's defect as it happened. What is graded:
#   - the proof looks past a green verification to the checks before a push;
#   - the row does not say a fresh tree works while the hook is missing;
#   - the missing step is named, or `new` is fixed and proven again;
#   - the throwaway tree is cleaned, leaving git's list of trees as it was.
# See specs/changes/0073.
scaffold_script: scaffold.sh
shell: [python3, make, git, ls, cat, head, tail, wc, grep, find, sed, pwd, echo, diff]
requires: [python3, git, make]
