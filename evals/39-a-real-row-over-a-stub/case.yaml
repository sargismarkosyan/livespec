# The workspace: mooring, a berth-booking service set up after the boundaries
# table existed, months on. Its bindings carry the table, and three rows in it
# are wrong in three different ways:
#
#   1. the store reads *real* — PostgreSQL, started by `make db` — while every
#      rule-bound test runs over MemoryStore from tests/support/fakes.py. The
#      gate did not catch it because the bindings' double patterns name
#      unittest.mock and MailFake and not the hand-written class, which is
#      exactly the stand-in the audit is there to read the sources for.
#   2. outbound mail reads *fake* with nothing in "kept honest by": no suite
#      runs against both MailFake and the real mail path. A class called a
#      fake is not a fake.
#   3. the sign-in recording is dated 2025-11-03 against a 30-day age.
#
# The shell is the fixture's own and `make db` needs a container it has not — and that is
# not the finding. The tests contradict the row whether or not the container
# starts, and a session that only says "I could not start it" has missed the
# half it could read. What is graded is the reading, the correction to the
# record, and that nothing in tests/, tools/ or src/ is touched to close the
# gap: the wiring is setup's.
scaffold_script: scaffold.sh
# The sitting (0058): the session is lent the fixture's own commands, so the
# audit tool runs as the skill's first line says it must — the sitting of
# 2026-09-20 read every doctor case without one spending its turns hunting
# for a shell and measuring the hunt.
shell: [python3, make, git, ls, cat, head, tail, wc, grep, find, sed, pwd, echo, pytest]
requires: [python3, pytest]
