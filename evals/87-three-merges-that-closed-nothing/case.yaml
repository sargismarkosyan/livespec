# The workspace: chandlery on a forge that is not GitHub, reached with the fixture's own client, set up without a
# row for what a merge request will close. !39 closed #26 on merge. !40, !41 and !42 opened with the keyword in front
# of a Markdown link to the issue — the form CLAUDE.md's "link every reference" produces — and the forge registered
# nothing, so #29, #31 and #33 were closed by hand.
#
# What is graded:
#   - the sitting reads back what the merged merge requests closed with the forge's own `mr closes`, and says why
#     three came back empty;
#   - the row names `python3 scripts/forge.py mr closes <n>`, never `gh` or `glab`, with the date it was watched
#     listing an issue;
#   - nothing under chandlery/, tools/, tests/ or scripts/ is touched.
# See specs/changes/0081.
scaffold_script: scaffold.sh
shell: [python3, make, git, ls, cat, head, tail, wc, grep, sed, pwd, echo, date]
requires: [python3, git, make]
